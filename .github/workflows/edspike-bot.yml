name: EDSPiKE GitHub Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/edspike')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/edspike'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EDSPiKE
        run: |
          pip install -e ".[test]"

      - name: Extract prompt
        id: prompt
        run: |
          BODY="${{ github.event.comment.body }}"
          PROMPT="${BODY#/edspike }"
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: Run EDSPiKE agent
        id: run
        env:
          EDSPIKE_API_KEY: ${{ secrets.EDSPIKE_API_KEY }}
          EDSPIKE_DEFAULT_PROVIDER: ${{ secrets.EDSPIKE_DEFAULT_PROVIDER || 'openai' }}
        run: |
          OUTPUT=$(edspike "${{ steps.prompt.outputs.prompt }}" --quiet 2>&1 || true)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post response
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.run.outputs.output }}`;
            const body = `**EDSPiKE AI Agent**\n\n${output}`;
            if (context.payload.issue) {
              github.rest.issues.createComment({
                issue_number: context.payload.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body.slice(0, 65000)
              });
            } else if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body.slice(0, 65000)
              });
            }
