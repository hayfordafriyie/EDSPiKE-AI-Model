name: Bump version on merge to Prod

on:
  pull_request:
    branches: [Prod]
    types: [closed]

jobs:
  bump:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'Prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump patch version on Prod
        id: bump
        run: |
          git checkout Prod
          python scripts/bump_version.py patch
          echo "new_version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/__init__.py').read())[1])")" >> $GITHUB_OUTPUT

      - name: Commit and tag on Prod
        run: |
          git config user.name "EDSPiKE Bot"
          git config user.email "bot@edspike.ai"
          git add -A
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin Prod --tags

      - name: Sync version to Staging to prevent merge conflicts
        run: |
          git checkout Staging
          python scripts/bump_version.py --set "${{ steps.bump.outputs.new_version }}"
          git add -A
          git commit -m "Sync version to ${{ steps.bump.outputs.new_version }} (match Prod)" || echo "No changes needed"
          git push origin Staging
