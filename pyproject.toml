[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EDSPiKE-ai-agent"
version = "1.0.10"
description = "Domain-agnostic AI agent platform: multi-agent orchestration, tool-use, continuous learning for any business"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "prometheus-client>=0.20,<1",
  "Pillow>=10,<11",
]

[project.optional-dependencies]
ml = [
  "torch>=2.1",
  "transformers>=4.38,<5",
  "datasets>=2.17,<4",
  "accelerate>=0.27,<2",
  "tokenizers>=0.15,<1",
  "numpy>=1.26,<3",
]
modalities = [
  "torch>=2.1",
  "transformers>=4.38,<5",
  "accelerate>=0.27,<2",
  "Pillow>=10,<11",
  "soundfile>=0.12,<1",
  "librosa>=0.10,<1",
  "torchaudio>=2.1",
  "opencv-python>=4.9,<5",
  "requests>=2.31,<3",
]
tools = [
  "gitpython>=3.1,<4",
]
tui = ["rich>=13,<14", "prompt-toolkit>=3,<4"]
test = ["pytest>=8,<9", "pytest-timeout>=2,<3", "httpx>=0.27,<1", "rich>=13,<14", "prompt-toolkit>=3,<4"]

[project.scripts]
edspike = "src.cli:run_cli"
EDSPiKE-data = "src.data_pipeline.cli:main"
EDSPiKE-train = "src.training.trainer:main"
EDSPiKE-evaluate = "src.evaluation.evaluate:main"
EDSPiKE-feedback = "src.continuous_learning.collector:main"
EDSPiKE-retrain = "src.continuous_learning.train:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

