[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edspike-ai-model"
version = "1.0.0"
description = "Training, evaluation and inference stack for the EDSPiKE education model"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
ml = [
  "torch>=2.1",
  "transformers>=4.38,<5",
  "datasets>=2.17,<4",
  "accelerate>=0.27,<2",
  "tokenizers>=0.15,<1",
  "numpy>=1.26,<3",
]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
edspike-data = "src.data_pipeline.cli:main"
edspike-train = "src.training.trainer:main"
edspike-evaluate = "src.evaluation.evaluate:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

