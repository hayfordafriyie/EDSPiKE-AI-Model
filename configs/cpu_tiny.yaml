model:
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  architecture: llama
  vocab_size: 32768
  hidden_size: 896
  intermediate_size: 4864
  num_hidden_layers: 24
  num_attention_heads: 16
  num_key_value_heads: 4
  max_sequence_length: 512
  dropout: 0.0
training:
  learning_rate: 0.0001
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  num_epochs: 1
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: no
  save_steps: 500
  output_dir: checkpoints/cpu-tiny
data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42
  min_text_length: 20
  max_text_length: 2048
compute:
  device: cpu
  mixed_precision: "no"
  gradient_checkpointing: true
  num_workers: 1
  max_ram_gb: 0.8
deployment:
  model_path: checkpoints/cpu-tiny
  backend: transformers
  quantization: int4
  max_model_len: 512
  device: cpu
  api_key_env: EDSPIKE_API_KEY
  max_batch_size: 1
